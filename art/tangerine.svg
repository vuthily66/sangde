  <path d="M206 88 C236 30 300 14 352 28 C330 76 270 104 206 88Z" fill="url(#leaf)"/>
  <path d="M206 88 C250 64 300 40 350 30" stroke="#A8D88A" stroke-width="2.5" fill="none" opacity="0.8"/>
  <g stroke="#7DBB5E" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M240 72 L252 52"/><path d="M268 60 L284 40"/><path d="M296 48 L314 32"/>
    <path d="M236 74 L250 88"/><path d="M266 62 L284 76"/><path d="M296 50 L316 60"/>
