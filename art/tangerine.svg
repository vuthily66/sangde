<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="peel" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#FFC266"/>
      <stop offset="0.28" stop-color="#FF9A1F"/>
      <stop offset="0.62" stop-color="#F2740B"/>
      <stop offset="0.88" stop-color="#C9500A"/>
      <stop offset="1" stop-color="#9E3A06"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b2008" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b2008" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FAE3A"/>
      <stop offset="0.55" stop-color="#2E7D24"/>
      <stop offset="1" stop-color="#1B5A17"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C9A2E"/>
      <stop offset="1" stop-color="#174F14"/>
    </linearGradient>
    <clipPath id="body"><path d="M200 82 C298 78 356 140 354 222 C352 306 288 356 200 356 C112 356 48 306 46 222 C44 140 102 78 200 82Z"/></clipPath>
    <filter id="dimples" x="0" y="0" width="100%" height="100%">
