      <feDiffuseLighting in="n" surfaceScale="1.6" lighting-color="#fff" result="l">
        <feDistantLight azimuth="225" elevation="55"/>
      </feDiffuseLighting>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.15  0 0 0 0 0  -1.6 0 0 0 1.35"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <ellipse cx="200" cy="362" rx="140" ry="18" fill="url(#shadow)"/>
  <path d="M200 82 C298 78 356 140 354 222 C352 306 288 356 200 356 C112 356 48 306 46 222 C44 140 102 78 200 82Z" fill="url(#peel)"/>
  <g clip-path="url(#body)">
    <rect width="400" height="400" filter="url(#dimples)" opacity="0.6"/>
    <ellipse cx="200" cy="340" rx="170" ry="40" fill="#7a2c04" opacity="0.25" filter="url(#soft)"/>
    <path d="M60 230 C70 300 130 345 200 348 C150 330 92 290 60 230Z" fill="#ffb14a" opacity="0.25" filter="url(#soft2)"/>
  </g>
  <ellipse cx="140" cy="150" rx="46" ry="30" transform="rotate(-28 140 150)" fill="url(#spec)" opacity="0.9"/>
  <ellipse cx="124" cy="142" rx="14" ry="8" transform="rotate(-28 124 142)" fill="#fff" opacity="0.75" filter="url(#soft2)"/>
  <!-- stem dimple -->
  <ellipse cx="200" cy="92" rx="30" ry="10" fill="#B4470A" opacity="0.6" filter="url(#soft2)"/>
