  <path d="M198 90 C162 74 122 62 86 56" stroke="#8CC870" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- stem -->
  <path d="M194 92 C194 76 198 66 206 60 L212 64 C206 70 204 80 206 92Z" fill="#5B4A1E"/>
  <ellipse cx="200" cy="92" rx="11" ry="5" fill="#6E8B2A"/>
